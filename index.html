<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Asesores | CUPISSA</title><link rel="icon" href="favicon.png"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="assets/form.css"><style>body{background:#fff7fa;color:#25202a;font-family:system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:20px}section.panel{background:white;border:1px solid #f5dce5;border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 5px 22px #a33a6810}label{display:block;font-size:13px;font-weight:650}input,select{width:100%;margin-top:5px}button.primary{background:#d92b75;color:white;border-radius:12px;padding:12px 20px;font-weight:750}button:disabled{opacity:.5}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header img{width:140px}h2{font-size:18px;font-weight:800;margin-bottom:12px} .admin-web-product-row{grid-template-columns:repeat(3,minmax(0,1fr))}.admin-web-product-row .wide{grid-column:1/-1}[hidden]{display:none!important}@media(max-width:650px){.admin-web-product-row{grid-template-columns:1fr 1fr}main{padding:12px}}</style><meta name="theme-color" content="#100b10"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="assets/dark.css"></head><body><main><header><img src="logo.png" alt="CUPISSA"><div class="header-actions"><button type="button" id="install-app" class="install-button"><i class="fa-solid fa-download" aria-hidden="true"></i> Descargar aplicación</button><button id="logout" class="admin-web-button" hidden>Cerrar sesión</button></div></header><p id="install-status" role="status" hidden></p><section id="login" class="panel max-w-md mx-auto"><div class="eyebrow">PORTAL DE ASESORES</div><h2>Iniciar sesión</h2><p class="login-intro">Gestiona tus pedidos CUPISSA.</p><form id="login-form" class="space-y-4"><label>Tipo de acceso<select id="role" class="admin-web-input"><option value="advisor">Asesor</option><option value="admin">Administrador</option></select></label><label id="login-label">Teléfono</label><input id="login-id" class="admin-web-input" type="tel" autocomplete="username" required><label>Contraseña<input id="password" class="admin-web-input" type="password" autocomplete="current-password" required></label><button class="primary w-full" type="submit">Iniciar sesión</button><p id="login-msg" role="alert" class="text-sm text-rose-700"></p></form></section><div id="app" hidden><section class="panel"><h2>Nuevo pedido</h2><p id="identity" class="text-sm text-pink-700"></p></section><form id="order-form"><section class="panel"><h2>Modalidad y entrega</h2><div class="grid sm:grid-cols-2 gap-4"><label>Modalidad *<select id="web-order-type" class="admin-web-input"><option>VENTA</option><option>ALQUILER</option></select></label><div id="month-box" class="calendar-wrap"><label for="calendar-open">Fecha de entrega *</label><button id="calendar-open" class="admin-web-input calendar-open" type="button" aria-expanded="false">Seleccionar fecha <i class="fa-solid fa-calendar-days"></i></button><input id="advisor-date" type="hidden"><div id="calendar-panel" class="calendar-panel" hidden><div class="calendar-nav"><button type="button" id="cal-prev" aria-label="Mes anterior">‹</button><strong id="cal-title"></strong><button type="button" id="cal-next" aria-label="Mes siguiente">›</button></div><div class="calendar-grid" id="calendar-grid"></div><p id="cal-status" role="status"></p></div></div><label id="admin-date-box" hidden>Fecha de entrega *<input id="web-order-date" class="admin-web-input" type="date" hidden disabled></label></div><p id="date-msg" class="text-sm text-slate-500 mt-2"></p></section><section class="panel"><h2>Datos del cliente</h2><div class="grid sm:grid-cols-2 gap-4"><label>Correo *<input id="correo" class="admin-web-input" type="email" required autocomplete="off"></label><label>Teléfono *<input id="telefono" class="admin-web-input" type="tel" required autocomplete="off"></label><p id="client-msg" class="sm:col-span-2 text-sm" role="status"></p><label>Nombres *<input id="nombres" class="admin-web-input" required></label><label>Apellidos *<input id="apellidos" class="admin-web-input" required></label><label>Cédula<input id="cedula" class="admin-web-input" ></label><label>Dirección *<input id="direccion" class="admin-web-input" required></label><label>Barrio *<input id="barrio" class="admin-web-input" required></label><label>Ciudad *<input id="ciudad" class="admin-web-input" required></label></div><p class="text-xs text-slate-500 mt-3">Los cambios en los datos del cliente se guardarán en su perfil al registrar el pedido.</p></section><section class="panel"><div class="flex justify-between items-center"><h2>Productos del pedido</h2><button type="button" class="admin-web-button" onclick="addWebOrderProductRow()">Añadir producto</button></div><div id="web-order-products" class="space-y-3"></div></section><section class="panel"><h2>Calculadora</h2><div class="grid sm:grid-cols-3 gap-4"><label>Total productos ($)<input id="web-order-total" type="number" class="admin-web-input" value="0" readonly></label><label>Domicilio / envío ($)<input id="web-order-shipping" type="number" min="0" step="1" class="admin-web-input" value="0" required></label><label>Anticipo ($)<input id="web-order-advance" type="number" min="0" step="1" class="admin-web-input" value="0" required></label></div><div class="bg-pink-50 p-4 rounded-xl mt-4"><strong>Restante por pagar: <span id="web-order-remaining">$ 0</span></strong><p id="web-order-balance-detail" class="text-sm"></p></div><p id="save-msg" role="alert" class="text-sm mt-3"></p><button id="save" type="submit" class="primary w-full mt-4">Guardar pedido</button></section></form></div></main><script src="assets/config.js"></script><script src="assets/app.js"></script><script src="assets/products.js"></script><script src="assets/install.js"></script></body></html>
